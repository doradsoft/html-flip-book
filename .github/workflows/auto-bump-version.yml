name: Auto Bump Version

on:
  release:
    types: [published]

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          token: ${{ secrets.BOT_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: bun
          cache-dependency-path: bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute the next version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          NEXT_VERSION=$(node -e 'const semver = require("semver"); const released = process.env.RELEASE_TAG.replace(/^v/, ""); const next = semver.inc(released, semver.prerelease(released) ? "prerelease" : "patch"); if (!next) process.exit(1); process.stdout.write(next)')
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"

      - name: Update manifests and lockfile
        run: |
          node -e 'const fs = require("fs"); for (const p of ["package.json", "base/package.json", "react/package.json", "react/example/package.json"]) { const j = JSON.parse(fs.readFileSync(p, "utf8")); j.version = process.env.NEXT_VERSION; fs.writeFileSync(p, JSON.stringify(j, null, "\t").replace(/("version": "[^"]+",)\n(\t")/, "$1\n\n$2") + "\n"); }'
          bun install --lockfile-only

      - name: Open a checked version-bump pull request
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          BRANCH="codex/bump-version-$NEXT_VERSION"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock base/package.json react/package.json react/example/package.json
          HUSKY=0 git commit -m "chore: prepare version $NEXT_VERSION"
          git push --set-upstream origin "$BRANCH"
          PR_URL=$(gh pr create --base master --head "$BRANCH" --title "chore: prepare version $NEXT_VERSION [skip ci]" --body "Prepare the next package version after the published release. CI must pass before this change reaches protected master. The squash commit skips master CI so this bump does not create another release.")
          echo "Created $PR_URL"
          for attempt in {1..30}; do
            CI_RUN_ID=$(gh run list --branch "$BRANCH" --workflow ci.yml --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$CI_RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$CI_RUN_ID" ]; then
            echo "CI did not start for $PR_URL" >&2
            exit 1
          fi
          gh run watch "$CI_RUN_ID" --exit-status
          gh pr checks "$PR_URL" --watch --fail-fast
          gh pr merge "$PR_URL" --squash --subject "chore: prepare version $NEXT_VERSION [skip ci]" --delete-branch
